services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CAREER_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.data:/app/.data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
