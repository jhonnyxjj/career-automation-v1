name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.13.6 ruff==0.17.3
      - run: uv sync --locked --no-editable
      - run: python -m compileall -q career
      - run: ruff check --select E9,F63,F7,F82 career tests
      - run: uv run --locked --no-sync mypy career
      - run: uv run --locked --no-sync python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx next typegen
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: docker compose -p career-v11-e2e -f compose.e2e.yaml up -d --build
      - run: bunx playwright test
        working-directory: web
      - name: Check API access-log privacy
        run: |
          curl --fail --silent 'http://127.0.0.1:18000/health?marker=synthetic_private_probe' > /dev/null
          api_logs=$(docker compose -p career-v11-e2e -f compose.e2e.yaml logs --no-color api)
          [[ "$api_logs" != *synthetic_private_probe* ]]
      - if: always()
        run: docker compose -p career-v11-e2e -f compose.e2e.yaml down
