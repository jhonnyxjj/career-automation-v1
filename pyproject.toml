[project]
name = "career-job-finder"
version = "0.1.0"
description = "Career automation API for job matching and tailored resumes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["career"]
